name: validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          if [ -f "backend_mock/requirements.txt" ]; then
            pip install -r backend_mock/requirements.txt
          else
            echo "No requirements.txt found, skipping."
          fi

      - name: Validate Python syntax
        run: |
          for script in backend_mock/*.py; do
            if [ -f "$script" ]; then
              python -m py_compile "$script"
            fi
          done

      - name: Validate Bash Scripts syntax
        run: |
          # Busca todos los scripts en la carpeta scripts/ e infra/ y verifica errores de sintaxis
          for script in scripts/*.sh infra/*/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done