services:
  postgres:
    image: postgres:16
    container_name: itba-fp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workshop_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workshop_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: itba-fp-localstack
    environment:
      SERVICES: s3,iam,ec2,secretsmanager,cloudfront,rds,ecs,logs
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  alb-mock:
    image: caddy:2-alpine
    container_name: itba-fp-alb-mock
    restart: unless-stopped
    command: caddy reverse-proxy --from :80 --to taller-backend-local:8000
    ports:
      - "80:80"
    depends_on:
      - localstack

volumes:
  postgres-data:
  localstack-data:
